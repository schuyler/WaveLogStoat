name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*' # Run only when a new version tag is pushed
  pull_request: # Also run on pull requests for CI
    branches:
      - master

jobs:
  # Job for testing builds on Pull Requests
  test-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.x'
      - name: Run Go Tidy
        run: go mod tidy
      - name: Test Build
        run: go build -v -o wavelog-stoat .

  # Job for creating a release
  goreleaser:
    if: startsWith(github.ref, 'refs/tags/v') # Only run for tags
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create the release
      packages: write # Needed to publish packages (if any)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch all history so GoReleaser can build the changelog
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.x'
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          # Use the .goreleaser.yml file from the repo
          distribution: goreleaser
          # Run the 'release' command
          args: release --clean
        env:
          # This token is provided by GitHub Actions
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job for building and pushing Docker image
  docker:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wavelog-stoat:latest
            ghcr.io/${{ github.repository_owner }}/wavelog-stoat:${{ steps.version.outputs.version }}
